<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inferno Lounge — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e8a13a;
    --cream:#f2ede2;
    --dim:#b9b3a6;
    --edge:#3a3a3a;
  }
  *{box-sizing:border-box;}
  html{background:#000;}
  body{
    margin:0; background:#000; color:var(--cream);
    font-family:'Poppins', sans-serif; font-weight:300;
  }
  header.hero{
    padding:34px 20px 24px; text-align:center;
    border-bottom:1px solid #2a2a2a; background:#000;
  }
  .logo-ring{width:76px; height:76px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;}
  .logo-ring img{width:100%; height:100%; object-fit:contain;}
  .brand-title{font-weight:600; letter-spacing:0.04em; font-size:0.9rem; text-transform:uppercase;}
  .menu-sub{font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-top:6px;}

  nav.tabs{
    position:sticky; top:0; z-index:20; display:flex;
    background:#000; border-bottom:1px solid #2a2a2a;
  }
  nav.tabs button{
    flex:1 1 0; min-width:0; background:none; border:none; color:var(--dim);
    font-family:'Poppins',sans-serif; font-weight:500; font-size:0.72rem;
    letter-spacing:0.03em; text-transform:uppercase; padding:15px 6px;
    cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
    -webkit-tap-highlight-color:rgba(232,161,58,0.2);
  }
  nav.tabs button.active{color:var(--gold); border-bottom-color:var(--gold);}

  main{max-width:920px; margin:0 auto; padding:26px 16px 60px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .boxed-heading{
    text-align:center; margin:26px auto 18px; display:flex;
    align-items:center; gap:14px; max-width:440px;
  }
  .boxed-heading:first-child{margin-top:4px;}
  .boxed-heading .ln{flex:1; height:1px; background:var(--edge);}
  .boxed-heading span{
    font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--cream); white-space:nowrap;
  }
  .boxed-heading .secprice{color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:0.78rem;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
  .card{border:1px solid var(--edge); text-align:center; padding:14px 10px;}
  .card .nm{font-size:0.85rem; letter-spacing:0.04em; text-transform:uppercase;}
  .card .pr{color:var(--gold); font-weight:600; margin-top:4px; font-family:'JetBrains Mono',monospace;}

  .pills{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:0.8rem; justify-content:center;}
  .pill .pr{color:var(--gold); font-weight:600;}

  ul.diamond{list-style:none; padding:0; margin:0;}
  ul.diamond li{position:relative; padding-left:16px; margin:6px 0; font-size:0.84rem; line-height:1.5;}
  ul.diamond li::before{content:"◆"; color:var(--gold); font-size:0.5rem; position:absolute; left:0; top:6px;}
  ul.diamond li b{font-weight:600;}
  ul.diamond li .desc{display:block; color:var(--dim); font-size:0.77rem; margin-top:1px;}

  .boxgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px;}
  .box{border:1px solid var(--edge); padding:16px 18px;}
  .box h3{
    margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--edge);
    font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:600;
    display:flex; justify-content:space-between; align-items:baseline; color:var(--gold);
  }
  .box h3 .pr{font-family:'JetBrains Mono',monospace; font-size:0.8rem;}
  .flavorlist{columns:2; column-gap:16px; list-style:none; padding:0; margin:0;}
  .flavorlist li{font-size:0.79rem; position:relative; padding-left:14px; margin:3px 0; break-inside:avoid;}
  .flavorlist li::before{content:"◆"; color:var(--gold); font-size:0.5rem; position:absolute; left:0; top:6px;}

  .line{display:flex; justify-content:space-between; gap:10px; font-size:0.82rem; padding:4px 0;}
  .line .opt{color:var(--dim); font-size:0.73rem; display:block;}
  .line .pr{color:var(--gold); font-family:'JetBrains Mono',monospace; white-space:nowrap;}

  .chips{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
  .chip{border:1px solid var(--edge); padding:10px 18px; font-size:0.72rem;
        letter-spacing:0.04em; text-transform:uppercase; color:var(--dim);}

  .unavailable{opacity:0.4;}
  .unavailable .nm::after, .unavailable > .lbl::after, .unavailable b::after,
  .unavailable.chip::after, .unavailable.pill::after{
    content:"UNAVAILABLE"; color:#c0392b; font-size:0.52rem; font-weight:700;
    letter-spacing:0.05em; margin-left:8px; border:1px solid #c0392b;
    padding:1px 5px; border-radius:3px; white-space:nowrap;
  }

  footer.foot{margin-top:30px; padding-top:16px; border-top:1px solid #2a2a2a; text-align:center;}
  footer.foot p{font-size:0.63rem; letter-spacing:0.03em; color:var(--dim); margin:5px 0; text-transform:uppercase;}
  .contact{text-align:center; margin-top:18px; font-size:0.73rem; color:var(--dim);}
  .contact a{color:var(--gold); text-decoration:none;}

  .status{
    text-align:center; font-size:0.62rem; color:#6d675e; padding:10px 16px 0;
    letter-spacing:0.04em; text-transform:uppercase;
  }
</style>
</head>

// ---------- CSV parsing ----------
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else {
      if(c === '"') q=true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function toObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const o={};
    head.forEach((h,i)=> o[h] = (r[i]||'').trim());
    return o;
  }).filter(o=>o.tab);
}

const isOut = v => ['n','no','false','0','out','86'].includes((v||'').trim().toLowerCase());
const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- rendering ----------
function render(data){
  const config = {};
  data.filter(r=>r.tab.toLowerCase()==='config').forEach(r=>{
    config[r.section.toLowerCase()] = r.item;
  });
  if(config.tagline) document.getElementById('tagline').textContent = config.tagline;

  const menu = data.filter(r=>r.tab.toLowerCase()!=='config');

  // group: tab -> section (preserving first-seen order)
  const tabs = [];
  const tabMap = new Map();
  menu.forEach(r=>{
    if(!tabMap.has(r.tab)){ tabMap.set(r.tab, new Map()); tabs.push(r.tab); }
    const sections = tabMap.get(r.tab);
    if(!sections.has(r.section)) sections.set(r.section, []);
    sections.get(r.section).push(r);
  });

  const nav = document.getElementById('tabs');
  const main = document.getElementById('main');
  nav.innerHTML = ''; main.innerHTML = '';

  tabs.forEach((tab, ti)=>{
    const btn = document.createElement('button');
    btn.textContent = tab;
    btn.dataset.tab = 'tab-'+ti;
    if(ti===0) btn.classList.add('active');
    nav.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel' + (ti===0 ? ' active' : '');
    panel.id = 'tab-'+ti;

    const sections = tabMap.get(tab);
    let boxBuffer = [];

    const flushBoxes = ()=>{
      if(!boxBuffer.length) return;
      const grid = document.createElement('div');
      grid.className = 'boxgrid';
      boxBuffer.forEach(b=>grid.appendChild(b));
      panel.appendChild(grid);
      boxBuffer = [];
    };

    sections.forEach((items, section)=>{
      const layout = (items[0].layout||'lines').toLowerCase();
      const secprice = items.find(i=>i.sectionprice)?.sectionprice || '';

      if(layout === 'notes'){
        flushBoxes();
        const f = document.createElement('footer');
        f.className='foot';
        f.innerHTML = items.map(i=>`<p>${esc(i.item)}</p>`).join('');
        panel.appendChild(f);
        return;
      }

      if(layout === 'flavors' || layout === 'lines'){
        const box = document.createElement('div');
        box.className='box';
        box.innerHTML = `<h3><span>${esc(section)}</span>${secprice?`<span class="pr">${esc(secprice)}</span>`:''}</h3>`;
        if(layout==='flavors'){
          const ul=document.createElement('ul');
          ul.className='flavorlist';
          ul.innerHTML = items.map(i=>
            `<li class="${isOut(i.available)?'unavailable':''}"><span class="lbl">${esc(i.item)}</span></li>`
          ).join('');
          box.appendChild(ul);
        } else {
          items.forEach(i=>{
            const d=document.createElement('div');
            d.className='line' + (isOut(i.available)?' unavailable':'');
            d.innerHTML = `<span><span class="lbl">${esc(i.item)}</span>${i.description?`<span class="opt">${esc(i.description)}</span>`:''}</span>`
                        + (i.price?`<span class="pr">${esc(i.price)}</span>`:'');
            box.appendChild(d);
          });
        }
        boxBuffer.push(box);
        return;
      }

      flushBoxes();
      const head = document.createElement('div');
      head.className='boxed-heading';
      head.innerHTML = `<div class="ln"></div><span>${esc(section)}${secprice?` <span class="secprice">${esc(secprice)}</span>`:''}</span><div class="ln"></div>`;
      panel.appendChild(head);

      if(layout === 'cards'){
        const g=document.createElement('div'); g.className='cards';
        g.innerHTML = items.map(i=>
          `<div class="card ${isOut(i.available)?'unavailable':''}">
             <div class="nm">${esc(i.item)}</div>
             ${i.price?`<div class="pr">${esc(i.price)}</div>`:''}
           </div>`).join('');
        panel.appendChild(g);
      } else if(layout === 'pills'){
        const g=document.createElement('div'); g.className='pills';
        g.innerHTML = items.map(i=>
          `<span class="pill ${isOut(i.available)?'unavailable':''}">${esc(i.item)}${i.price?` <span class="pr">${esc(i.price)}</span>`:''}</span>`
        ).join('');
        panel.appendChild(g);
      } else if(layout === 'chips'){
        const g=document.createElement('div'); g.className='chips';
        g.innerHTML = items.map(i=>
          `<span class="chip ${isOut(i.available)?'unavailable':''}">${esc(i.item)}</span>`).join('');
        panel.appendChild(g);
      } else if(layout === 'mixes'){
        const ul=document.createElement('ul'); ul.className='diamond';
        ul.innerHTML = items.map(i=>
          `<li class="${isOut(i.available)?'unavailable':''}"><b>${esc(i.item)}</b>${i.price?` <span class="pr">${esc(i.price)}</span>`:''}${i.description?`<span class="desc">${esc(i.description)}</span>`:''}</li>`
        ).join('');
        panel.appendChild(ul);
      }
    });

    flushBoxes();

    if(ti === tabs.length-1 && (config.contact || config.phone)){
      const c=document.createElement('div');
      c.className='contact';
      const bits=[];
      if(config.contact) bits.push(esc(config.contact));
      if(config.phone) bits.push(esc(config.phone));
      if(config.instagram) bits.push(`<a href="https://instagram.com/${esc(config.instagram.replace('@',''))}" target="_blank" rel="noopener">${esc(config.instagram)}</a>`);
      c.innerHTML = bits.join(' &nbsp;·&nbsp; ');
      panel.appendChild(c);
    }

    main.appendChild(panel);
  });

  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      main.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

// ---------- load ----------
let lastGood = null;

async function load(){
  const status = document.getElementById('status');
  try{
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?')?'&':'?') + 'cb=' + Date.now();
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = parseCSV(await res.text());
    const data = toObjects(rows);
    if(!data.length) throw new Error('empty sheet');
    lastGood = data;
    render(data);
    status.textContent = 'Menu updated ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }catch(e){
    console.warn('Sheet load failed:', e);
    if(!lastGood){
      render(toObjects(FALLBACK));
      status.textContent = 'Showing saved menu';
    }
  }
}

load();
setInterval(load, 3*60*1000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') load();
});
